<script>
    const urlParams = new URLSearchParams(window.location.search);
    const stadiumIdFromUrl = urlParams.get('id');
    // التحقق مما إذا كان المستخدم يطلب صفحة التسجيل بشكل صريح
    const isRegisterAction = urlParams.get('action') === 'register';
    const isFromApp = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    // 1. إذا دخل المستخدم عبر رابط ملعب معين (يحتوي على ID)
    if (stadiumIdFromUrl) {
        localStorage.setItem('lastVisitedStadiumId', stadiumIdFromUrl);
        // التوجيه لصفحة الحجز مع المعرف
        window.location.replace("booking.html?id=" + stadiumIdFromUrl);
    } 
    
    // 2. إذا دخل المستخدم لرابط التسجيل الصريح (منع التوجيه التلقائي للملعب القديم)
    else if (isRegisterAction) {
        window.location.replace("register.html");
    }

    // 3. إذا فتح المستخدم "أيقونة التطبيق" المثبتة
    else if (isFromApp) {
        const lastId = localStorage.getItem('lastVisitedStadiumId');
        if (lastId) {
            window.location.replace("booking.html?id=" + lastId);
        } else {
            window.location.replace("register.html");
        }
    } 
    
    // 4. الدخول العادي عبر المتصفح للرابط الرئيسي
    else {
        // نتحقق أولاً إذا كان هناك ملعب محفوظ لنقله إليه، وإلا فصفحة التسجيل
        const lastId = localStorage.getItem('lastVisitedStadiumId');
        if (lastId) {
            window.location.replace("booking.html?id=" + lastId);
        } else {
            window.location.replace("register.html");
        }
    }
</script>
